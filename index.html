<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo App</title>
  <link href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="todo-container">
    <!-- 헤더 -->
    <div class="todo-header">
      <h1>Todo App</h1>
    </div>

    <!-- 뷰 토글 스위치 -->
    <div class="view-toggle-container">
      <label class="view-toggle">
        <input type="checkbox" id="viewToggle" class="toggle-checkbox">
        <span class="toggle-slider">
          <span class="toggle-label daily">일간</span>
          <span class="toggle-label weekly">주간</span>
        </span>
      </label>
      <span class="view-mode-text" id="viewModeText">일간 뷰</span>
    </div>

    <!-- 일간 뷰 -->
    <div id="dailyView" class="view-content active">
      <!-- 날짜 네비게이션 -->
      <div class="date-navigation">
        <button id="prevBtn" class="date-nav-btn">◀</button>
        <input 
          type="date" 
          id="dateInput" 
          class="date-input"
        >
        <button id="nextBtn" class="date-nav-btn">▶</button>
      </div>
    </div>

    <!-- 주간 뷰 -->
    <div id="weeklyView" class="view-content">
      <!-- 주간 네비게이션 -->
      <div class="week-navigation">
        <button id="prevWeekBtn" class="week-nav-btn">◀</button>
        <div class="week-range" id="weekRange"></div>
        <button id="nextWeekBtn" class="week-nav-btn">▶</button>
      </div>
      <!-- 요일 그리드 -->
      <div class="week-grid" id="weekGrid"></div>
    </div>

    <!-- 입력 영역 -->
    <div class="input-area">
      <input 
        type="text" 
        id="todoInput" 
        class="todo-input"
        placeholder="새로운 TODO를 입력하세요"
      >
      <button id="addBtn" class="add-btn">추가</button>
    </div>

    <!-- 필터 탭 -->
    <div class="filter-tabs">
      <button class="filter-btn active" data-filter="all">전체</button>
      <button class="filter-btn" data-filter="doing">진행중</button>
      <button class="filter-btn" data-filter="done">완료</button>
    </div>

    <!-- Todo 리스트 -->
    <ul id="todoList" class="todo-list">
      <!-- JavaScript로 동적 생성 -->
    </ul>
  </div>

  <script src="app.js"></script>
</body>
</html>
